<a class="skip-link" href="#main">Skip to content</a>
@if (publicPage()) {
  <main #content id="main" class="public-content" tabindex="-1"><router-outlet /></main>
} @else {
  <div class="app-frame">
    <header class="workspace-header">
      <a class="brand" routerLink="/dashboard" aria-label="Valora overview"><app-brand-mark /></a>
      <button
        #menu
        class="menu-toggle"
        type="button"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="menuOpen() ? 'Close navigation' : 'Open navigation'"
        aria-controls="primary-navigation"
        (click)="toggleMenu()"
      >
        <ng-icon [name]="menuOpen() ? 'lucideX' : 'lucideMenu'" aria-hidden="true" />
      </button>
      <app-environment-indicator (businessMode)="setBusinessMode($event)" />
      <app-session-nav />
    </header>
    @if (menuOpen()) {
      <button
        class="navigation-backdrop"
        type="button"
        tabindex="-1"
        aria-label="Close navigation"
        (click)="closeMenu()"
      ></button>
    }
    <nav
      id="primary-navigation"
      class="primary-navigation"
      [class.is-open]="menuOpen()"
      [attr.role]="menuOpen() ? 'dialog' : null"
      [attr.aria-modal]="menuOpen() ? 'true' : null"
      aria-label="Main navigation"
    >
      @if (menuOpen()) {
        <div class="drawer-heading">
          <app-brand-mark /><button
            class="drawer-close"
            type="button"
            aria-label="Close navigation"
            (click)="closeMenu()"
          >
            <ng-icon name="lucideX" aria-hidden="true" />
          </button>
        </div>
      }
      @for (group of groups; track group.label) {
        <div class="nav-group">
          @if (group.label) {
            <p>{{ group.label }}</p>
          }
          @for (link of group.links; track link[0]) {
            <a
              [routerLink]="link[0]"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: link[0] === '/dashboard' || link[0] === '/saas' }"
              ariaCurrentWhenActive="page"
            >
              <ng-icon [name]="link[2]" aria-hidden="true" />
              {{ link[1] }}</a
            >
          }
        </div>
      }
      <app-backend-status />
    </nav>
    <div class="workspace-content">
      <main #content id="main" tabindex="-1">
        @if (modeLoaded()) {
          <router-outlet />
        }
      </main>
    </div>
  </div>
}
<app-confirm-dialog />
