spring:
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-numbers-for-enums: true
      fail-on-unknown-properties: true
  application:
    name: smartpricing
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: SP_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
  tomcat:
    accesslog:
      enabled: false
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  shopify:
    enabled: ${SHOPIFY_ENABLED:false}
    client-id: ${SHOPIFY_CLIENT_ID:}
    client-secret: ${SHOPIFY_CLIENT_SECRET:}
    encryption-key: ${SHOPIFY_ENCRYPTION_KEY:}
    public-base-url: ${SHOPIFY_PUBLIC_BASE_URL:}
    sync:
      api-version: ${SHOPIFY_SYNC_API_VERSION:2026-10}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:4200}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
