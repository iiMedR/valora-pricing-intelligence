spring:
  datasource:
    url: ${NEON_JDBC_URL}
    username: smartpricing_demo
    password: ${NEON_DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 45000
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8088}
app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:4208}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4208}
