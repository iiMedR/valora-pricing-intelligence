name: smartpricing-demo
services:
  postgres-demo:
    profiles: [demo]
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: smartpricing_demo_admin
      POSTGRES_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Initialize the local demo credentials first}
      DEMO_DB_PASSWORD: ${DEMO_DB_PASSWORD:?Initialize the local demo credentials first}
    ports:
      - "127.0.0.1:${DEMO_DB_PORT:-5434}:5432"
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
      - ./demo/10-isolated-demo.sh:/docker-entrypoint-initdb.d/10-isolated-demo.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U smartpricing_demo_admin -d smartpricing_demo"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  demo_postgres_data:
